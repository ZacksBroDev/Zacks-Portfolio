<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description"
    content="I am Zackary Brown. A Frontend Engineer with experience in React, JavaScript, TypeScript, HTML, CSS, Tailwind CSS, and modern web technologies" />
  <meta name="author" content="Zackary Brown" />
  <meta name="keywords"
    content="Zackary Brown, Frontend Engineer, React Developer, JavaScript Developer, TypeScript Developer, Web Developer, UI Engineer, Software Engineer" />
  <link rel="icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>Zackary Brown | Portfolio</title>

  <style>
    #loader-container {
      background-color: #212121;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999999;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 160px;
      width: 170px;
      position: relative;
      margin: 0;
      padding: 0;
    }

    .loading_circle {
      border: 5px transparent solid;
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 69%;
    }

    .loading_blue {
      top: 0;
      border-top: 5px lightblue solid;
      animation-delay: 4s;
      animation: blue_animation 1.5s infinite;
    }

    .loading_blue:after {
      position: absolute;
      content: "";
      width: 10px;
      height: 10px;
      background: lightblue;
      border-radius: 69%;
      right: 5px;
      top: 10px;
      box-shadow: 0 0 20px lightblue;
    }

    .loading_blue:before {
      content: " ";
      width: 5px;
      height: 5px;
      position: absolute;
      background: lightblue;
      top: 8.8px;
      left: 9px;
      border-radius: 69%;
    }

    .loading_coral {
      left: 0;
      bottom: 0;
      border-top: 5px #fd5857 solid;
      animation: coral_animation 1.5s infinite;
    }

    .loading_coral:after {
      position: absolute;
      content: "";
      width: 10px;
      height: 10px;
      background: #fd5857;
      border-radius: 69%;
      right: 5px;
      top: 10px;
      box-shadow: 0 0 20px #fd5857;
    }

    .loading_coral:before {
      content: " ";
      width: 5px;
      height: 5px;
      position: absolute;
      background: #fd5857;
      top: 8.8px;
      left: 9px;
      border-radius: 69%;
    }

    .loading_orange {
      right: 0;
      bottom: 0;
      border-top: 5px #f79d41 solid;
      animation: orange_animation 1.5s infinite;
    }

    .loading_orange:after {
      position: absolute;
      content: "";
      width: 10px;
      height: 10px;
      background: #f79d41;
      border-radius: 69%;
      right: 5px;
      top: 10px;
      box-shadow: 0 0 20px #f79d41;
    }

    .loading_orange:before {
      content: " ";
      width: 5px;
      height: 5px;
      position: absolute;
      background: #f79d41;
      top: 8.8px;
      left: 9px;
      border-radius: 69%;
    }

    @keyframes blue_animation {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes coral_animation {
      0% {
        transform: rotate(240deg);
      }

      100% {
        transform: rotate(600deg);
      }
    }

    @keyframes orange_animation {
      0% {
        transform: rotate(120deg);
      }

      100% {
        transform: rotate(480deg);
      }
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <div id="loader-container">
      <div class="loading">
        <div class="loading_circle loading_blue"></div>
        <div class="loading_circle loading_coral"></div>
        <div class="loading_circle loading_orange"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
